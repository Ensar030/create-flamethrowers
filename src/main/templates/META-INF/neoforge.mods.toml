license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "OhneLags"
description = '''Lava-powered, rotation-driven flamethrowers for Create.
Jet, fan, fire tornado and napalm launcher. They do not just light fires: they actively burn
wood, leaves and plants in front of them, so a vehicle (Create Aeronautics, Let it Walk!) can
torch a path straight through a forest. Works on Sable ships and walkers.'''

